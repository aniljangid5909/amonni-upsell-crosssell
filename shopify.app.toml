name = "amonni-upsell-crosssell"
client_id = ""
application_url = "https://TUNNEL_URL"
embedded = true

[build]
  automatically_update_urls_on_dev = true
  dev_store_url = "amoni-apps.myshopify.com"

[[web]]
  previewable = true

  [web.commands]
    dev = "npm exec -- remix vite:dev"
    build = "npm exec -- remix vite:build"

[access_scopes]
scopes = "read_products,read_orders,write_products"

[auth]
redirect_urls = [
  "https://TUNNEL_URL/auth/callback",
  "https://TUNNEL_URL/auth/shopify/callback",
  "https://TUNNEL_URL/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

[pos]
embedded = false
